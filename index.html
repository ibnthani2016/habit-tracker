<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Habit Tracker</h1>
      <p class="app-subtitle">Productivity focus. All data stays on this device.</p>
    </header>

    <main>
      <!-- Status announcements for screen readers -->
      <div id="status-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

      <section class="habits-section" aria-labelledby="habits-heading">
        <h2 id="habits-heading" class="visually-hidden">Your Habits</h2>
        <ul id="habit-list" class="habit-list" role="list">
          <!-- Habits rendered here -->
        </ul>
      </section>

      <!-- Add Habit Form -->
      <section id="add-habit-section" class="add-habit-section" aria-labelledby="add-habit-heading">
        <h2 id="add-habit-heading" class="section-heading">Add a Habit</h2>
        <form id="add-habit-form" class="add-habit-form" novalidate>
          <div class="form-field">
            <label for="habit-name">Name</label>
            <input
              id="habit-name"
              type="text"
              name="name"
              maxlength="100"
              required
              placeholder="e.g., Read for 30 minutes"
              aria-describedby="habit-name-help"
            />
            <span id="habit-name-help" class="field-help">Up to 100 characters</span>
          </div>

          <div class="form-field">
            <label for="habit-frequency">Frequency</label>
            <select id="habit-frequency" name="frequency" required>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
            </select>
          </div>

          <div id="deadline-day-field" class="form-field" hidden>
            <label for="habit-deadline-day">Deadline day</label>
            <select id="habit-deadline-day" name="deadlineDay" aria-describedby="deadline-day-help">
              <option value="0">Sunday</option>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
            <span id="deadline-day-help" class="field-help">Day by which the weekly habit must be done</span>
          </div>

          <button type="submit" class="btn btn-primary">Add Habit</button>
        </form>
      </section>

      <section class="stats-section" aria-labelledby="stats-heading">
        <h2 id="stats-heading">Stats</h2>
        <dl class="stats-grid" id="stats-display">
          <!-- Stats rendered here -->
        </dl>
      </section>
    </main>

    <footer class="app-footer">
      <button
        id="export-btn"
        type="button"
        class="btn btn-secondary"
        aria-label="Export all habit data as a JSON file"
      >
        Export Data
      </button>
      <button
        id="reset-btn"
        type="button"
        class="btn btn-danger"
        aria-label="Delete all habit data and reset to defaults"
      >
        Reset All Data
      </button>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
